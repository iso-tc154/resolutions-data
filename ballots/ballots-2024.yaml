  title:
  - spelling: eng
    value: change of project leader of ISO 23355
  subject:
  - spelling: eng
    value: ISO 23355 project leader appointment
  actions:
  - type: appoints
    date_effective:
      date: '2024-03-06'
      type: effective
    message:
    - spelling: eng
      value: |
        change of project leader of ISO 23355 and
        appoint Ms. Xiaoyun Gao (SAC) as the project leader of ISO 23355 to
        replace Ms.Huiting Yang.
  considerations:
  - type: noting
    date_effective:
      date: '2024-02-05'
      type: adoption
    message:
    - spelling: eng
      value: |
        ISO/DIS 23355 ballot closed in Aug 2022, and the project was
        re-assigned to JWG9 as per N1412.
  - type: noting
    date_effective:
      date: '2024-02-05'
      type: adoption
    message:
    - spelling: eng
      value: |
        Ms. Huiting Yang (SAC) was the project leader of ISO 23355, but she
        resigned and will not be responsible for ISO 23355.
  - type: noting
    date_effective:
      date: '2024-02-05'
      type: adoption
    message:
    - spelling: eng
      value: |
        Ms. Xiaoyun Gao, from the same project team with Ms Huiting Yang, was
        nominated by SAC to replace the project leader and proceed the
        development of ISO 23355.
  - type: noting
    date_effective:
      date: '2024-02-05'
      type: adoption
    message:
    - spelling: eng
      value: |
        JWG9 and CAG meeting on 24 Jan also agreed to initiate a CIB ballot
        for the change of project leader.
- identifier:
  - prefix: ISO/TC 154
    number: 2024-03
  urn: urn:iso:tc154:resolution:ballots-2024:2024-03
  kind: resolution
  status: decided
  dates:
  - date: '2024-03-04'
    type: adoption
  categories:
  - project management
  title:
  - spelling: eng
    value: change of development period for ISO 7372(UNTDED)
  subject:
  - spelling: eng
    value: ISO 7372 development timeline
  actions:
  - type: decides
    date_effective:
      date: '2024-04-04'
      type: effective
    message:
    - spelling: eng
      value: |
        change of development period for ISO
        7372(UNTDED) from 24 months to 36 months with the following target
        date:

        CD ballot 2025-02-28

        DIS ballot 2025-09-30

        FDIS submission (if required) 2026-06-30

        publication 2026-11-06.
  considerations:
  - type: noting
    date_effective:
      date: '2024-03-04'
      type: adoption
    message:
    - spelling: eng
      value: |
        Based on Resolution 2023-13, ISO 7372(UNTDED) has been approved to
        revise and registered as ISO/AWI 7372 on 2023-11-06, and the
        development period was 24 months.
  - type: noting
    date_effective:
      date: '2024-03-04'
      type: adoption
    message:
    - spelling: eng
      value: |
        During JWG9 meeting of 20 Feb, project leader thought that 24 months
        is insufficient to develop the project, and proposed change the
        timeframe from 24 months to 36 months. And JWG9 made this
        recommention. CAG meeting of 21 Feb also proposed the project period
        change.
