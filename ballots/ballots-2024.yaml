    script: Latn
    title: Adoption of a PWI for the project Guidance of data registration for data
      utilization
    subject: data registration guidance PWI
    considerations:
    - type: noting
      date_effective:
        date: '2024-05-13'
        type: adoption
      message: |
        This proposal was presented and discussed at TC level meeting on 31
        Jan, 11 April, and also discussed at CAG meeting of 25 April.
    - type: noting
      date_effective:
        date: '2024-05-13'
        type: adoption
      message: |
        CAG meeting of 25 April made a recommendation to launch a CIB for the
        PWI project registration.
    - type: noting
      date_effective:
        date: '2024-05-13'
        type: adoption
      message: |
        This PWI project title is "Guidance of data registration for data
        utilization" with the following scope "This document introduces the
        guidance of data registration for utilization with the governance
        bodies and market. It clarifies the purpose, object and considerations
        for registration, gives the basic principles, stakeholders,
        registration process, registration content and requirements of data
        registration. This document applies to the data registration
        organization to guide the registration subject to conduct data
        registration."
    actions:
    - type: adopts
      date_effective:
        date: '2024-06-13'
        type: effective
      message: |
        Adoption of a PWI for the project "Guidance of data registration for
        data utilization"
- identifier:
  - prefix: ISO/TC 154
    number: 2024-12
  kind: resolution
  status: decided
  dates:
  - date: '2024-07-19'
    type: adoption
  categories:
  - project management
  localizations:
  - language_code: eng
    script: Latn
    title: Cancellation of ISO/TR 19626-3
    subject: ISO/TR 19626-3 cancellation
    considerations:
    - type: noting
      date_effective:
        date: '2024-07-19'
        type: adoption
      message: |
        Many editorial issues in the draft of ISO/TR 19626-3 have been
        identified that the content does not meet the ISO editorial
        requirements and policies. In particular, the subject matter
        (guidelines, i.e. recommendations) is inappropriate for the
        deliverable type as a Technical Report. The text contains
        requirements, recommendations and permissions, which are not allowed
        in an informative Technical Report. As a consequence, the submission
        has been rejected.
    - type: noting
      date_effective:
        date: '2024-07-19'
        type: adoption
      message: 'In April, WG6 recommend to cancel the TR project and restart an IS
        project.

        '
    - type: noting
      date_effective:
        date: '2024-07-19'
        type: adoption
      message: |
        CAG meeting of 25 April recorded that Shi suggested the cancellation
        ballot of ISO/TR 19626-3 based on this WG6 recommendation can be
        handled after the NP Form 4 and new draft are ready.
    - type: noting
      date_effective:
        date: '2024-07-19'
        type: adoption
      message: |
        CAG meeting of 27 June recorded that SHI will follow up for this with
        Jianfang to initiate the CIB ballot to approve the cancellation.
    - type: noting
      date_effective:
        date: '2024-07-19'
        type: adoption
      message: |
        This CIB ballot is to cancel ISO/TR 19626-3. When the form4 and new
        draft are ready, the project will be initiated a NP ballot as a new
        project ISO 19626-3 (an IS deliverable).
    actions:
    - type: withdraws
      date_effective:
        date: '2024-08-20'
        type: effective
      message: 'Cancellation of ISO/TR 19626-3

        '
