    title: Appointment of project co-leaders of ISO/PWI 16356
    subject: ISO/PWI 16356 co-leaders
    considerations:
    - type: noting
      date_effective:
        date: '2024-04-08'
        type: adoption
      message: |
        ISO/PWI 16356 had been proposed by Ms. Wenting Chang (SAC), and JWG9
        meeting in Feb recommended to nominate Ms. Wenting Chang from the ISO
        side as the co-project leader of ISO/PWI 16356 and UNECE nominates Mr.
        Hao Wu (dearwuhao@hotmail.com) as the co-project leader of ISO/PWI
        16356 "Data and process of edible agricultural products based on
        blockchain and DLT application".
    - type: noting
      date_effective:
        date: '2024-04-08'
        type: adoption
      message: |
        Jianfang pointed out that ISO/PWI 16356 need to be initiated the NP
        ballot, the project co-leaders will be submitted via Form4. When the
        NP ballot is approved, the project co-leaders will be confirmed and
        registered accordingly as per the voting result Form6. This CIB ballot
        can be covered by NP ballot and is not necessary at this PWI stage.
    - type: noting
      date_effective:
        date: '2024-04-08'
        type: adoption
      message: |
        CAG meeting of 27 March, JWG9 conveners thought the CIB is not against
        the ISO/IEC Directives, and the CIB ballot shall be initiated.CAG
        meeting agreed to initiated the CIB ballot to appoint the project
        co-leaders of ISO/PWI 16356.
    actions:
    - type: appoints
      date_effective:
        date: '2024-05-08'
        type: effective
      message: |
        Appointment of Ms. Wenting Chang (bainuan.cwt@antgroup.com) from
        ISO/TC 154 side and Mr. Hao Wu (dearwuhao@hotmail.com) from UNECE side
        as the project co-leaders of ISO/PWI 16356.
