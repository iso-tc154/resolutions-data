- identifier:
  - prefix: ISO/TC 154
    number: 2018-03
  urn: urn:iso:tc154:resolution:plenary-37:2018-03
  kind: resolution
  status: decided
  dates:
  - date: '2018-10-11'
    type: adoption
  categories:
  - Resolutions related to WG 5
  title:
  - spelling: eng
    value: Encouragement the use of ISO 8601 series
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: encourages
    date_effective:
      date: '2018-10-11'
      type: effective
    message:
    - spelling: eng
      value: resolves to encourage Standards Development Organizations (SDOs) and
        others who use ISO 8601 to determine if any alignment is necessary for the
        adoption of the new version of ISO 8601-1 and ISO 8601-2 in their standards,
        specifications and recommendations
  - type: requests
    date_effective:
      date: '2018-10-11'
      type: effective
    message:
    - spelling: eng
      value: requests ISO/CS for assistance in encouraging use of the updated ISO
        8601 series amongst user communities and ISO members.
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2018-10-11'
      type: adoption
    message:
    - spelling: eng
      value: The resolution was taken by unanimity
  considerations:
  - type: considering
    date_effective:
      date: '2018-10-11'
      type: effective
    message:
    - spelling: eng
      value: considering the ISO 8601 series has already been submitted to ISO/CS
        for FDIS ballot and will be published as an International Standard (IS)
  - type: considering
    date_effective:
      date: '2018-10-11'
      type: effective
    message:
    - spelling: eng
      value: considering that ISO 8601 serves a very important role and is of high
        priority amongst ISO standards
  - type: considering
    date_effective:
      date: '2018-10-11'
      type: effective
    message:
    - spelling: eng
      value: considering the resolution 2016-05 “encouragement the use of ISO 8601
        series”
