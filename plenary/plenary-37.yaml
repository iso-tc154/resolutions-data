  - language_code: eng
    script: Latn
    title: secretariat of ISO/TC 154/JWG 1 remaining with DIN until the end of next
      year
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    considerations:
    - type: considering
      date_effective:
        date: '2018-10-11'
        type: effective
      message: considering the announcement from DIN to relinquish the secretariat
        of JWG 1
    - type: considering
      date_effective:
        date: '2018-10-11'
        type: effective
      message: considering that volunteers from UNECE and SAC (GS1 China) have expressed
        willingness to take over the JWG 1 secretariat role but with unconfirmed commitment
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2018-10-11'
        type: adoption
      message: The resolution was taken by unanimity
    actions:
    - type: resolves
      date_effective:
        date: '2018-10-26'
        type: effective
      message: resolves that the secretariat of ISO/TC 154/JWG 1 will be re-allocated
        within the period of 12 months, according to the ISO Directives Part 1 (1.9.4)
- identifier:
  - prefix: ISO/TC 154
    number: 2018-03
  kind: resolution
  status: decided
  dates:
  - date: '2018-10-11'
    type: adoption
  categories:
  - Resolutions related to WG 5
  localizations:
  - language_code: eng
    script: Latn
    title: Encouragement the use of ISO 8601 series
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    considerations:
    - type: considering
      date_effective:
        date: '2018-10-11'
        type: effective
      message: considering the ISO 8601 series has already been submitted to ISO/CS
        for FDIS ballot and will be published as an International Standard (IS)
    - type: considering
      date_effective:
        date: '2018-10-11'
        type: effective
      message: considering that ISO 8601 serves a very important role and is of high
        priority amongst ISO standards
    - type: considering
      date_effective:
        date: '2018-10-11'
        type: effective
      message: considering the resolution 2016-05 “encouragement the use of ISO 8601
        series”
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2018-10-11'
        type: adoption
      message: The resolution was taken by unanimity
    actions:
    - type: encourages
      date_effective:
        date: '2018-10-11'
        type: effective
      message: resolves to encourage Standards Development Organizations (SDOs) and
        others who use ISO 8601 to determine if any alignment is necessary for the
        adoption of the new version of ISO 8601-1 and ISO 8601-2 in their standards,
        specifications and recommendations
    - type: requests
      date_effective:
        date: '2018-10-11'
        type: effective
      message: requests ISO/CS for assistance in encouraging use of the updated ISO
        8601 series amongst user communities and ISO members.
