- identifier:
  - prefix: ISO/TC 154
    number: 2018-14
  kind: resolution
  status: decided
  dates:
  - date: '2018-10-11'
    type: adoption
  categories:
  - Resolutions related to WG 7
  localizations:
  - language_code: eng
    script: Latn
    title: Extension of one year for the time deadline of ISO 21981 until 2020-10-04
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    considerations:
    - type: considering
      date_effective:
        date: '2018-10-11'
        type: effective
      message: considering the length of time it took to appoint a new project leader
        for ISO/WD 21981 after the resignation of the previous project leader (Klaus)
    - type: considering
      date_effective:
        date: '2018-10-11'
        type: effective
      message: considering the lack of input from experts of the MoU/MG and ISO/TC
        154 to the project since the resignation of Klaus
    - type: considering
      date_effective:
        date: '2018-10-11'
        type: effective
      message: considering two normative references standards ISO 25964-1:2011 and
        25964-2:2013 need to contact with ISO/TC46 or ISO/CS to be provided for the
        project leader to ensure compliance
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2018-10-11'
        type: adoption
      message: The resolution was taken by unanimity
    actions:
    - type: resolves
      date_effective:
        date: '2018-10-26'
        type: effective
      message: resolves to extend the publication deadline (stage 60.60) of ISO 21981
        by one year until 2020-10-04 to allow the project leader to move forward with
        the project
