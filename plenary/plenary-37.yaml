  - spelling: eng
    value: Extension of one year for the time deadline of ISO 21981 until 2020-10-04
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: resolves
    date_effective:
      date: '2018-10-26'
      type: effective
    message:
    - spelling: eng
