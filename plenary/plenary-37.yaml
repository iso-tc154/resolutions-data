  localizations:
  - language_code: eng
    script: Latn
    title: 'Adoption of ISO/PWI 9735-11 “Electronic data interchange for administration,
      commerce and transport (EDIFACT) - Part 11: Version 3 compatible profile for
      Version 4 of ISO 9735”'
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    considerations:
    - type: considering
      date_effective:
        date: '2018-10-11'
        type: effective
      message: considering the presentation report status of the project from GS1
        and UNECE
    - type: considering
      date_effective:
        date: '2018-10-11'
        type: effective
      message: considering the interoperability between the version 3 and version
        4 of ISO 9735
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2018-10-11'
        type: adoption
      message: The resolution was taken by unanimity
    actions:
    - type: adopts
      date_effective:
        date: '2018-10-11'
        type: effective
      message: 'resolves to adopt ISO/PWI 9735-11 on “Electronic data interchange
        for administration, commerce and transport (EDIFACT) - Part 11: Version 3
        compatible profile for Version 4 of ISO 9735”

        '
    - type: request
      date_effective:
        date: '2018-10-11'
        type: effective
      message: 'requests JWG 1 to prepare the submission for NWIP ballot by end of
        this year

        '
