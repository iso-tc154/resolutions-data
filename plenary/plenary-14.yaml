- identifier:
  - prefix: ISO/TC 154
    number: '145'
  kind: resolution
  status: decided
  urn: urn:iso:tc154:resolution:plenary-14:145
  dates:
  - date: '1998-03-12'
    type: adoption
  title:
  - spelling: eng
    value: A recommendation should be developed by the TC 154 secretariat for the
      ISO/TMB proposing…
  subject:
  - spelling: eng
    value: ISO/TC 154
  considerations:
  - type: noting
    date_effective:
      date: '1998-03-12'
      type: effective
    message:
    - spelling: eng
      value: 'notes that this recommendation is in line with JTC1/SC30 resolution
        1997/1

        '
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '1998-03-12'
      type: adoption
    message:
    - spelling: eng
      value: Unanimous
  actions:
  - type: resolves
    date_effective:
      date: '1998-03-12'
      type: effective
    message:
    - spelling: eng
      value: |
        ISO/TC 154 resolves that a recommendation should be developed by the
        TC 154 secretariat for the ISO/TMB proposing the setting up of a
        single ISO technical committee covering the meta standards and the
        implementation level standards in support of EDI/EC. This would group
        the existing ISO/TC 154 with ex JTC1/SC14 and SC30. It would have the
        impact of streamlining the standardization process, including positive
        cost and resource impacts, as well as providing a single focal point
        for ISO on EDI/EC matters in the ISO/IEC/UN-ECE MoU.
