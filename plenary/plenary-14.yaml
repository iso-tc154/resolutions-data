- identifier:
  - prefix: ISO/TC 154
    number: '138'
  kind: resolution
  status: decided
  urn: urn:iso:tc154:resolution:plenary-14:138
  dates:
  - date: '1998-03-12'
    type: adoption
  title:
  - spelling: eng
    value: ISO/CS to take the necessary steps.
  subject:
  - spelling: eng
    value: ISO/TC 154
  message:
  - spelling: eng
    value: ISO/TC 154 resolves that even though there will be a new version 4 of ISO
      9735 in autumn 1998, the current version 3 (ISO 9735 1st edition with amendments
      1 and 2) will still have to be a retained edition, as there will be on-going
      users for that version, and requests ISO/CS to take the necessary steps.
  considerations:
  - type: considering
    date_effective:
      date: '1998-03-12'
      type: effective
    message:
    - spelling: eng
      value: even though there will be a new version 4 of ISO 9735 in autumn 1998,
        the current version 3 (ISO 9735 1st edition with amendments 1 and 2) will
        still have to be a retained edition, as there will be on-going users for that
        version
  approvals:
  - type: affirmative
    degree: unanimous
