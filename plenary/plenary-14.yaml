- identifier:
  - prefix: ISO/TC 154
    number: '142'
  kind: resolution
  status: decided
  urn: urn:iso:tc154:resolution:plenary-14:142
  dates:
  - date: '1998-03-12'
    type: adoption
  title:
  - spelling: eng
    value: Denis Hill prepare a maximum 2 page summary of the BSR system requirements
      for submission…
  subject:
  - spelling: eng
    value: ISO/TC 154
  considerations:
  - type: noting
    date_effective:
      date: '1998-03-12'
      type: effective
    message:
    - spelling: eng
      value: in relation to the BSR system
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '1998-03-12'
      type: adoption
    message:
    - spelling: eng
      value: Unanimous
  actions:
  - type: requests
    date_effective:
      date: '1998-03-12'
      type: effective
    message:
    - spelling: eng
      value: 'Denis Hill prepare a maximum 2 page summary of the BSR system requirements
        for submission to the three identified system providers - US/EPA, INSEE (France)
        and the Czech standards body.

        '
  - type: requests
    date_effective:
      date: '1998-03-12'
      type: effective
    message:
    - spelling: eng
      value: 'the 3 identified system providers should send their offers and business
        plans to Denis Hill by the end of April 1998.

        '
  - type: requests
    date_effective:
      date: '1998-03-12'
      type: effective
    message:
    - spelling: eng
      value: 'that an ad hoc group be set up to evaluate these offers. Names of candidates
        to be submitted to Denis Hill, e-mail: hill@iso.ch, by the 20th March 1998.

        '
  - type: requests
    date_effective:
      date: '1998-03-12'
      type: effective
    message:
    - spelling: eng
      value: 'that the recommendation of the ad hoc group be made available electronically
        to the P-members of TC/154, and that the choice of the eventual provider be
        handled electronically by the end of June 1998.

        '
  - type: requests
    date_effective:
      date: '1998-03-12'
      type: effective
    message:
    - spelling: eng
      value: 'the 3 identified systems providers should jointly consider how they
        could collaborate in providing a distributed registration authority service,
        once the decision has been taken as to the chosen solution

        '
