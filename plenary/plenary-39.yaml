  title:
  - spelling: eng
    value: Adoption of the title change of the ISO 14533 series into “Information
      technology — Long term signature”
  subject:
  - spelling: eng
    value: ISO/TC 154
  actions:
  - type: resolves
    date_effective:
      date: '2020-08-27'
      type: effective
    message:
    - spelling: eng
      value: |
        resolves to update the title of the ISO 14533 series as following, and
        their meaning to be the same as previously

        * ISO 14533-1 Information technology — Long term signature — Part 1 -
        Profiles for CMS Advanced Electronic Signatures (CAdES)

        * ISO 14533-2 Information technology — Long term signature — Part 2 -
        Profiles for XML Advanced Electronic Signatures (XAdES)

        * ISO 14533-3 Information technology — Long term signature — Part 3 -
        Profiles for PDF Advanced Electronic Signatures (PAdES)

        * ISO 14533-4 Information technology — Long term signature — Part 4 -
        Attributes pointing to (external) proof of existence objects
        (PoEAttributes)
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2020-08-27'
      type: adoption
    message:
    - spelling: eng
      value: The resolution was taken by unanimity.
