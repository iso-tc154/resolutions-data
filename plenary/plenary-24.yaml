- identifier:
  - prefix: ISO/TC 154
    number: '270'
  kind: resolution
  status: decided
  urn: urn:iso:tc154:resolution:plenary-24:270
  dates:
  - date: '2006-03-22'
    type: adoption
  title:
  - spelling: eng
    value: In accordance with the context and resolutions of the eBusiness MoU and
      its MG, ISO/TC…
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2006-03-22'
      type: adoption
    message:
    - spelling: eng
      value: Approved
  actions:
  - type: recommends
    date_effective:
      date: '2004-09-10'
      type: effective
    message:
    - spelling: eng
      value: |
        In accordance with the context and resolutions of the eBusiness MoU
        and its MG, ISO/TC 154 resolves to recommend to the ISO/TC 154 member
        countries and liaison organizations that they should:

        - submit candidate standards for business vocabularies to UN/CEFACT;

        - submit only eBusiness-related candidate implementation
        methodologies, specifications and guidelines based on the UN/CEFACT
        Core Component Technical Specification (ISO/TS 15000-5) for
        consideration as future ISO publications through ISO/TC 154;

        - implement the UN/CEFACT Core Component Technical Specification
        (ISO/TS 15000-5).
