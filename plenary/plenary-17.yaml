- identifier:
  - prefix: ISO/TC 154
    number: '189'
  kind: resolution
  status: decided
  dates:
  - date: '2000-09-20'
    type: adoption
  subject:
  - spelling: eng
    value: ISO/TC 154
  actions:
  - type: resolves
    date_effective:
      date: '2000-09-21'
      type: effective
    message:
    - spelling: eng
      value: to establish a liaison group, composed of Mr Vuilleumier (ISO/TC 154
        Chairman), liaison officer assisted by Mr Boesler (DIN, DE), Mr Chiaramonti
        (ISO/TC 154/WG 1 Convener), Mr Hermes (DIN, DE), Mr Kubler (ISO/TC 154 Secretary),
        to attend the EWG meeting to be held in Washington DC in 2001-03 ; and
  - type: resolves
    date_effective:
      date: '2000-09-21'
      type: effective
    message:
    - spelling: eng
      value: to present BSR and ISO 7372 (UNTDED) to EWG and discuss opportunities
        for cooperation with UN/EDIFACT.
  - type: notes
    date_effective:
      date: '2000-09-21'
      type: effective
    message:
    - spelling: eng
      value: |
        BACKGROUND :
          - Historically the UNTDED was first issued as the single, common repository of semantic concepts that are used in the paper environment, later also in EDI, with bridges (so called "topographical co-ordinates") to sectoral directories as CIMP of IATA, SAD of EC/EFTA, SWIFT and MAR of IMO ;
          - the EDI developments, specially UN/EDIFACT, were based initially on this semantic concepts repository ISO7372 (UNTDED) ;
          - over time, the concept of generic data element and coded qualifiers developed by UN/EDIFACT enforced the syntax dependence for expressing semantic concepts ;
          - hence a semantic concept in UN/EDIFACT requires usually a combination of at least a data element along with a code value.
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2000-09-20'
      type: adoption
    message:
    - spelling: eng
      value: Adopted
  considerations:
  - type: identifying
    date_effective:
      date: '2000-09-21'
      type: effective
    message:
    - spelling: eng
      value: identifying ISO7372 (UNTDED) as a key element in the set of ISO standards
        as listed in TC143N324 “Suite of ISO standards around the UN layout-key and
        UNTDED”
  - type: identifying
    date_effective:
      date: '2000-09-21'
      type: effective
    message:
    - spelling: eng
      value: 'recognising MoU resolution 99/27, confirming the maintenance procedures
        of the standard as stated in ISO 7372 (UNTDED), section 2 (see TC 154N339):'
  - type: noting
    date_effective:
      date: '2000-09-21'
      type: effective
    message:
    - spelling: eng
      value: noting the EWG Resolution 19 from the 2000-09 meeting, related to joint
        collaboration between EWG and ANSI ASC X12 about core components ;
  - type: noting
    date_effective:
      date: '2000-09-21'
      type: effective
    message:
    - spelling: eng
      value: and furthermore noting the will and need expressed in this Resolution
        19 of EWG 2000-09, for a single, syntax independent repository of semantic
        concepts ;
  - type: noting
    date_effective:
      date: '2000-09-21'
      type: effective
    message:
    - spelling: eng
      value: 'noting the TC 154/WG 1 (BSR) Resolution 13, which states : “ISO/TC 154/WG1
        appoints Mr Vuilleumier as liaison officer, to be assisted by deputies, to
        the EWG meeting to be held in Washington DC in 2001-03” ;'
  - type: recognising
    date_effective:
      date: '2000-09-21'
      type: effective
    message:
    - spelling: eng
      value: recognising the need to secure consistency and continuity for existing
        user communities ;
  - type: considering
    date_effective:
      date: '2000-09-21'
      type: effective
    message:
    - spelling: eng
      value: considering that any revision to ISO7372 (UNTDED) requires to take into
        account both EDED and UNCL of UN/EDIFACT ;
  - type: considering
    date_effective:
      date: '2000-09-21'
      type: effective
    message:
    - spelling: eng
      value: taking stock of the need for it to address the role of the BSR in relation
        to the revision of ISO7372 (UNTDED) ;
