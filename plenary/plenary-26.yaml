  - date: '2009-09-25'
    type: adoption
  title:
  - spelling: eng
    value: Approval of specification of codelists for TDED/EDED alignment
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: approves
    date_effective:
      date: '2009-09-25'
      type: effective
    message:
    - spelling: eng
      value: |
        ISO/TC 154, having considered the results of TDED Joint MA meeting on 2009-09-24, resolves to approve that the codelists for TDED / EDED alignment should include:
        - UN/EDIFACT Codelist - UNCL
        - UNECE Trade Recommendation Codelists – currently maintained by ICG
        And that ISO 9735 service elements and recommendations are not included.
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2009-09-25'
      type: adoption
    message:
    - spelling: eng
      value: UNANIMOUS
