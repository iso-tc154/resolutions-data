- identifier:
  - prefix: ISO/TC 154
    number: 014-2012
  urn: urn:iso:tc154:resolution:plenary-31:014-2012
  kind: resolution
  status: decided
  dates:
  - date: '2012-10-12'
    type: adoption
  title:
  - spelling: eng
    value: Encourage active participation in MoU‐eB/MG
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: encourages
    date_effective:
      date: '2012-10-12'
      type: effective
    message:
    - spelling: eng
      value: encourages the members of the MoU‐eB/MG to put in their best effort,
        including participation in meetings from start to end, thereby allowing open
        dialogues with other members of the MoUeB/MG, to further improve the collaboration
        between the involved parties
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2012-10-12'
      type: adoption
    message:
    - spelling: eng
      value: The resolution was taken by unanimity
  considerations:
  - type: considering
    date_effective:
      date: '2012-10-12'
      type: effective
    message:
    - spelling: eng
      value: considering the purpose of the MoU‐eB/MG is to minimize the risk of divergent
        and competitive approaches to standardization, to avoid duplication of efforts,
        and to avoid confusion amongst users
