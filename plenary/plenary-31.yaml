- identifier:
  - prefix: ISO/TC 154
    number: 016-2012
  urn: urn:iso:tc154:resolution:plenary-31:016-2012
  kind: resolution
  status: decided
  dates:
  - date: '2012-10-12'
    type: adoption
  title:
  - spelling: eng
    value: Withdrawal of ISO TS 15000 parts 1, 2, 3 and 4
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: resolves
    date_effective:
      date: '2012-10-12'
      type: effective
    message:
    - spelling: eng
      value: resolves to initiate a Committee Internal Ballot (CIB) to withdraw all
        4 parts. The CIB shall provide the information on the outdated content to
        support the member countries in their resolution.
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2012-10-12'
      type: adoption
    message:
    - spelling: eng
      value: The resolution was taken by unanimity
  considerations:
  - type: considering
    date_effective:
      date: '2012-10-12'
      type: effective
    message:
    - spelling: eng
      value: checking the output of the systematic reviews on ISO/TS 15000‐1, ‐2,
        ‐3 and ‐4
  - type: considering
    date_effective:
      date: '2012-10-12'
      type: effective
    message:
    - spelling: eng
      value: noting that the majority votes for confirmation of all 4 parts
  - type: considering
    date_effective:
      date: '2012-10-12'
      type: effective
    message:
    - spelling: eng
      value: recognizing that at least two member countries (USA and Germany) voted
        for withdrawal due to the fact that the content of all four TS documents are
        outdated and repeated requests for OASIS to submit their published newer versions
        were not successful
- identifier:
  - prefix: ISO/TC 154
    number: 017-2012
  urn: urn:iso:tc154:resolution:plenary-31:017-2012
  kind: resolution
  status: decided
  dates:
  - date: '2012-10-12'
    type: adoption
  title:
  - spelling: eng
    value: Request to UNECE to engage ISO/CS
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: requests
    date_effective:
      date: '2012-10-12'
      type: effective
    message:
    - spelling: eng
      value: requests, since ISO/TC 154's efforts failed to resolve this conflict,
        that the UNECE engage with the ISO/CS to address and resolve this encroachment.
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2012-10-12'
      type: adoption
    message:
    - spelling: eng
      value: The resolution was taken by unanimity
  considerations:
  - type: considering
    date_effective:
      date: '2012-10-12'
      type: effective
    message:
    - spelling: eng
      value: considering that the issue with ISO/TC 8, regarding ISO 28005 Parts 1
        & 2, is mainly about their encroachment on the division of responsibilities
        in the area of standardization assigned under the MoU on eBusiness, to UN/CEFACT
