    type: adoption
  title:
  - spelling: eng
    value: Resignation of Mr. Michael Dill as convenor of ISO/TC 154/WG 4
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  message:
  - spelling: eng
    value: 'with regret accepts the resignation of its WG 4 convenor Mr. Michael Dill,
      effective immediately. The TC expresses its appreciation to Mr. Michael Dill
      for his outstanding contribution to the work of ISO/TC 154. The Technical Committee
      wishes Mr. Michael Dill every success for the future.

      '
  actions:
  - type: accepts
    date_effective:
      date: '2012-10-12'
      type: effective
    message:
    - spelling: eng
      value: with regret accepts the resignation of its WG 4 convenor Mr. Michael
        Dill, effective immediately.
  - type: appreciates
    date_effective:
      date: '2012-10-12'
      type: effective
    message:
    - spelling: eng
      value: The TC expresses its appreciation to Mr. Michael Dill for his outstanding
        contribution to the work of ISO/TC 154. The Technical Committee wishes Mr.
        Michael Dill every success for the future.
  approvals:
  - type: affirmative
    degree: unanimous
