  - date: '2012-10-12'
    type: adoption
  title:
  - spelling: eng
    value: ePUB standard for the conversion of ISO deliverables into XML
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: encourages
    date_effective:
      date: '2012-10-12'
      type: effective
    message:
