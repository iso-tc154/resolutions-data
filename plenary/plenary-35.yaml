    number: 2016-01
  kind: resolution
  status: decided
  dates:
  - date: '2016-10-21'
    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: Adoption of a PWI for the new part ISO 14533-4
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    considerations:
    - type: considering
      date_effective:
        date: '2016-10-21'
        type: effective
      message: considering the SK/SOSMT proposal report status for the new part ISO
        14533-4
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2016-10-21'
        type: adoption
      message: The resolution was taken by unanimity
    actions:
    - type: resolves
      date_effective:
        date: '2016-10-21'
        type: effective
      message: resolves to adopt a PWI as the new part ISO 14533-4 on “Attributes
        pointing to external Proof of Existence objects used in Long term signature
        formats (PoEAttributes)”
    - type: requests
      date_effective:
        date: '2016-10-21'
        type: effective
      message: requests SK/SOSMT to prepare the final working draft for NWIP ballot
