    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: Encouragement the use of ISO 8601 series
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    considerations:
    - type: considering
      date_effective:
        date: '2016-10-21'
        type: effective
      message: considering ISO 8601 series are updating
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2016-10-21'
        type: adoption
      message: The resolution was taken by unanimity
    actions:
    - type: requests
      date_effective:
        date: '2016-10-21'
        type: effective
      message: resolves that ISO/TC 154 members, who have a link to Standards Development
        Organizations and others which use ISO 8601, to review the impact of the proposed
        changes in order to determine what alignment may be needed to their standards,
        specifications and recommendations
