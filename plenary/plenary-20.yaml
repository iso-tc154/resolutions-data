- identifier:
  - prefix: ISO/TC 154
    number: '228'
  kind: resolution
  status: decided
  urn: urn:iso:tc154:resolution:plenary-20:228
  dates:
  - date: '2003-03-07'
    type: adoption
  title:
  - spelling: eng
    value: Are very grateful to Andrew Schoka for providing the group with an introduction
      to the…
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2003-03-07'
      type: adoption
    message:
    - spelling: eng
      value: Unanimous
  actions:
  - type: thanks
    date_effective:
      date: '2003-03-07'
      type: effective
    message:
    - spelling: eng
      value: ISO/TC 154 are very grateful to Andrew Schoka for providing the group
        with an introduction to the past, present and future work plans of TC204.
        Andrew described TC204’s new Work Item, NP24533, entitled "Data Dictionary
        and Message Set to Facilitate the Movement of Freight and its Intermodal Transfer
        - Road Transport Information Interchanges". He reported that liaisons have
        been established with key organisations e.g. UN/CEFACT. At a recent meeting
        of ISO TC204 WG7.2 it was recognised that collaboration was an important element
        of this project. It appears that there are areas of potential overlap that
        need urgent investigation, creating opportunities for harmonisation. Particular
        areas include (a) methodology - UN/CEFACT-ebXML CCTS, (b) data element naming
        and defining - the ISO 7372 (UNTDED) MA and the several UN/CEFACT TBG domain
        BP modelling and CC definition projects. These include work in the supply
        chain related domain groups TBG1 (Materials Management), TBG2 (Procurement),
        TBG3 (Transport & Logistics), TBG4 (Customs), & TBG5 (Finance).
  - type: recognises
    date_effective:
      date: '2003-03-07'
      type: effective
    message:
    - spelling: eng
      value: TC 154 recognises that there exists a tangible opportunity for crucial
        convergence between the TC204 ISO 14817 and the UN/CEFACT-ebXML CCTS. In order
        to promote and secure this much needed convergence, TC 154 resolves to support
        and strengthen liaison between the 7372MA activity, the UN/CEFACT Forum, and
        TC204 to achieve this goal.
