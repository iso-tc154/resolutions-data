      type: effective
    message:
    - spelling: eng
      value: |
        ISO/TC 154 acknowledges receipt of the ISO/IEC JTC1/SC32 comments (see document 154n441). Thank you for your contribution.

        Reminder:

        From: Clivio Sophie

        To: Douglas Mann; Bruce Bargmeyer; Keith Brannon

        Cc: Michael Smith; Francois Vuilleumier; Patricia Bartels; Karl Best

        Sent: Monday, January 06, 2003 10:39 AM

        Subject: Eb-XML specifications under ISO approval in ISO TC 154-JTC1 participation

        Dear Doug and Bruce,

        OASIS and UN/CEFACT are now submitting their eb-XML specifications for approval as ISO TS (Technical specifications) in ISO TC 154. 6 out of the 8 eb-XML parts will be submitted as a first package, the 2 others (part 2 and 8) will come later, when completed.

        Given that 2/3 of the eb-XML specs are of direct relevance to TC 154 (within TC 154 scope), it has been agreed that the eb-XML specs would be hosted by TC 154 with the creation of a new (virtual) joint WG (under TC 154 lead) involving the JTC1 SCs concerned ( mainly SC32) in order to involve the JTC1 expertise in the process.

        The ballot on the 6 first Technical specifications will be launched by ISO TC 154 in the next few days, under the generic title ISO TS 15000: "Electronic Business eXtensible Mark-up Language (ebXML) parts 1,3,4,5,6 and 7", and we would ask JTC1 SC32 to comment on the various parts (specifications) when they are of direct relevance to your subcommittee and to nominate expert(s) if needed, to discuss the potential comments with the parties involved.

        François Vuilleumier as TC 154 Chair and secretary will contact you ASAP to set up the process.

        [...]

        Should you need any further information, do not hesitate to contact me or François directly or Keith Brannon at ISOCS. Keith will contact Lisa for securing the JTC1 participation

        Kind regards and Happy New Year - Sophie
