    type: adoption
  title:
  - spelling: eng
    value: ISO8601 Expert (Editing) Group to consolidate all comments received to
      date into a table,…
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2003-03-07'
      type: adoption
    message:
    - spelling: eng
      value: Unanimous
  actions:
  - type: requests
    date_effective:
      date: '2003-03-07'
      type: effective
    message:
    - spelling: eng
      value: |
        ISO/TC 154 requests the ISO8601 Expert (Editing) Group to consolidate all comments received to date into a table, updating document 8601RevN007.

        The Group will make an initial ranking into categories of:

        1. 'will implement' on e.g. typographical errors, obvious improvements,

        2. 'will not implement' on comments that are counter-productive,

        3. 'for wider discussion' when opinions from all TC 154 participants are valuable, updating document 8601RevN002r1.

        These two papers will be distributed by the Expert (Editing) Group to TC 154 membership, seeking confirmation of categories 1 and 2, and further input on category 3.

        Distribution is anticipated by end May, and feedback would be required by end July. It is anticipated that a revised ISO 8601 could be distributed for the CD ballot in August.
  - type: empowers
    date_effective:
      date: '2003-03-07'
      type: effective
    message:
    - spelling: eng
      value: TC 154 empowers the expert group to ask the ISO/TC 154 Secretary to launch
        the revised 8601 CD ballot when the expert group feels ready to do so.
