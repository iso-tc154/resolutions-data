    script: Latn
    title: Cancellation and restart a revision of ISO 7372 with no scope expansion
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    considerations:
    - type: considering
      date_effective:
        date: '2025-09-26'
        type: effective
      message: considering that the project is already on the maximum 36-month timeframe
        and still at AWI stage, the option of extending for 9 months is not enough
        for the project development
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2025-09-26'
        type: adoption
      message: The resolution was adopted by unanimity.
    actions:
    - type: resolves
      date_effective:
        date: '2025-09-26'
        type: effective
      message: |
        resolves to cancel and restart the revision of ISO 7372 (with starting stage 20.00) without
        scope expansion, and the project supports SDG9
    - type: appoints
      date_effective:
        date: '2025-09-26'
        type: effective
      message: 'Project leader: Ms. Hanane Becha (hbdigitaltrade@gmail.com)

