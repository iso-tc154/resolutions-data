  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: resolves
    date_effective:
      date: '2025-09-26'
      type: effective
    message:
    - spelling: eng
      value: |
        resolves to cancel and restart the revision of ISO 7372 (with starting stage 20.00) without
        scope expansion, and the project supports SDG9
  - type: appoints
    date_effective:
      date: '2025-09-26'
      type: effective
    message:
    - spelling: eng
      value: 'Project leader: Ms. Hanane Becha (hbdigitaltrade@gmail.com)

        '
  - type: defines
    date_effective:
      date: '2025-09-26'
      type: effective
    message:
    - spelling: eng
      value: |
        Development track (36 months): the target date for CD ballot: 2027-04-30, limit date for DIS ballot
        2027-10-01, FDIS submission (if required) 2028-06-30 and the target date for publication is 2028-10-01
