- identifier:
  - prefix: ISO/TC 154
    number: P-2025-01
  kind: resolution
  status: decided
  dates:
  - date: '2025-09-26'
    type: adoption
  categories:
  - Resolution related to the establishment of SG1
  localizations:
  - language_code: eng
    script: Latn
    title: Establishment of a SG1 with title "Standardization content and document"
      and appointment of Mr. Ronald Henry Tse as the convener
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2025-09-26'
        type: adoption
      message: The resolution was adopted by unanimity.
    actions:
    - type: resolves
      date_effective:
        date: '2025-09-26'
        type: effective
      message: |
        resolves to establish a new Study Group with the title “Standardization content and
        document” for ISO/PWI 36100 and ISO/PWI 36200 for further investigation into the topic, and appoint
        Mr. Ronald Henry Tse as the convener for a period of 1 year.
    - type: requests
      date_effective:
        date: '2025-09-26'
        type: effective
      message: 'P-members and liaison organizations are invited to nominate experts
        to participate in the study group.

        '
- identifier:
  - prefix: ISO/TC 154
    number: P-2025-02
  kind: resolution
  status: decided
  dates:
  - date: '2025-09-26'
    type: adoption
  categories:
  - Resolution related to WG 5
  localizations:
  - language_code: eng
    script: Latn
    title: Adoption of a revision of ISO 34000 with no scope expansion
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    considerations:
    - type: considering
      date_effective:
        date: '2025-09-26'
        type: effective
      message: considering that the revision of two parts of ISO 8601 will include
        new and significant concepts as well as updated definitions of terms and the
        role of ISO 34000 as a consolidating vocabulary document of the field of date
        and time
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2025-09-26'
        type: adoption
      message: The resolution was adopted by unanimity.
    actions:
    - type: resolves
      date_effective:
        date: '2025-09-26'
        type: effective
      message: |
        resolves to revise ISO 34000 (with starting stage 20.00) without scope expansion, and the
        project supports SDG9
    - type: appoints
      date_effective:
        date: '2025-09-26'
        type: effective
      message: 'Project leader: Mr. Ronald Henry Tse (tse@ribose.com)

        '
    - type: defines
      date_effective:
        date: '2025-09-26'
        type: effective
      message: |
        Development track (36 months): the target date for CD ballot: 2027-04-30, limit date for DIS ballot
        2027-10-01, FDIS submission (if required) 2028-06-30 and the target date for publication is 2028-10-01
