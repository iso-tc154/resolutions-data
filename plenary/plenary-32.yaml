    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: Retain ISO 7372:2005 (Ed. 3) after its revision
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    considerations:
    - type: recognizing
      date_effective:
        date: '2013-10-28'
        type: effective
      message: recognizing that there is still a user/business need for ISO 7372:2005
        (Ed. 3) after its next revision,
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2013-10-25'
        type: adoption
      message: The resolution was taken by unanimity
    actions:
    - type: requests
      date_effective:
        date: '2013-10-28'
        type: effective
      message: requests ISO/TMB to retain ISO 7372:2005 (Ed. 3) once the next revision
        has been published.
- identifier:
  - prefix: ISO/TC 154
    number: 006-2013
  kind: resolution
  status: decided
  dates:
  - date: '2013-10-25'
    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: Withdrawal of ISO TS 15000 parts 1, 2, 3 and 4
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    considerations:
    - type: considering
      date_effective:
        date: '2013-10-28'
        type: effective
      message: considering the output of the systematic reviews on ISO/TS 15000-1,
        -2, -3 and -4;
    - type: recognizing
      date_effective:
        date: '2013-10-28'
        type: effective
      message: recognizing the fact that the content of all four TS documents are
        outdated and that repeated requests to OASIS to submit their published newer
        versions were not successful;
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2013-10-25'
        type: adoption
      message: The resolution was taken by unanimity
    actions:
    - type: resolves
      date_effective:
        date: '2013-10-28'
        type: effective
      message: resolves to withdraw all 4 parts, with the option to reinstate these
        parts with newer versions when these are received from OASIS.
- identifier:
  - prefix: ISO/TC 154
    number: 007-2013
  kind: resolution
  status: decided
  dates:
  - date: '2013-10-25'
    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: Registration ISO 14533-1 as DIS
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    considerations:
    - type: considering
      date_effective:
        date: '2013-10-28'
        type: effective
      message: considering that a first draft for the revision of ISO 14533-1 is available,
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2013-10-25'
        type: adoption
      message: The resolution was taken by unanimity
    actions:
    - type: resolves
      date_effective:
        date: '2013-10-28'
