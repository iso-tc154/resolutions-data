- identifier:
  - prefix: ISO/TC 154
    number: 003-2013
  kind: resolution
  status: decided
  dates:
  - date: '2013-10-25'
    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: Establishment of ISO/TC 154/WG 5
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    considerations:
    - type: considering
      date_effective:
        date: '2012-10-12'
        type: effective
      message: considering that project ISO/PWI 8601-2 has not been assigned to a
        WG, and
    - type: considering
      date_effective:
        date: '2012-10-12'
        type: effective
      message: continuous maintenance work on ISO 8601:2004 is needed,
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2013-10-25'
        type: adoption
      message: The resolution was taken by unanimity
    actions:
    - type: resolves
      date_effective:
        date: '2013-10-28'
        type: effective
      message: resolves to establish ISO/TC 154/WG 5 with the following title 'Representation
        of dates and times', to take on the work related to the 8601 deliverables.
