      message: resolves to register ISO 14533-1 as a Draft International Standard
        (DIS – stage 40.00) once a NWI has been adopted.
- identifier:
  - prefix: ISO/TC 154
    number: '008-2013'
  kind: resolution
  status: decided
  dates:
  - date: '2013-10-25'
    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: Encouragement MoU-eB/MG
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2013-10-25'
        type: adoption
      message: The resolution was taken by unanimity
    actions:
    - type: encourages
      date_effective:
        date: '2013-10-28'
        type: effective
      message: encourages the MoU-eB/MG to focus on its core activities to address
        overlaps and duplications, and encourages the signatories to ensure that they
        act on identified issues in a speedy manner, and in addition encourages the
        MoU-eB/MG members to participate fully during the entire course of the meeting
        to ensure that coordination can take place within the membership.
