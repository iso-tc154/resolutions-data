  - spelling: eng
    value: Withdrawal of ISO TS 15000 parts 1, 2, 3 and 4
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: resolves
    date_effective:
      date: '2013-10-28'
      type: effective
    message:
    - spelling: eng
      value: resolves to withdraw all 4 parts, with the option to reinstate these
        parts with newer versions when these are received from OASIS.
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2013-10-25'
      type: adoption
    message:
    - spelling: eng
      value: The resolution was taken by unanimity
  considerations:
  - type: considering
    date_effective:
      date: '2013-10-28'
      type: effective
    message:
    - spelling: eng
      value: considering the output of the systematic reviews on ISO/TS 15000-1, -2,
        -3 and -4;
  - type: recognizing
    date_effective:
      date: '2013-10-28'
      type: effective
    message:
    - spelling: eng
      value: recognizing the fact that the content of all four TS documents are outdated
        and that repeated requests to OASIS to submit their published newer versions
        were not successful;
