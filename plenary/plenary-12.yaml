- identifier:
  - prefix: ISO/TC 154
    number: '114'
  kind: resolution
  status: decided
  dates:
  - date: '1996-10-21'
    type: adoption
  subject:
  - spelling: eng
    value: ISO/TC 154
  actions:
  - type: requests
    date_effective:
      date: '1996-10-21'
      type: effective
    message:
    - spelling: eng
      value: ISO/TC 154 would like to be given the responsibility for processing the
        BSR Project during the project phase and will require the setting up of a
        subcommittee and establishing a maintenance agency for ongoing BSR operation
        and maintenance once the project phase has been completed
  - type: requests
    date_effective:
      date: '1996-10-21'
      type: effective
    message:
    - spelling: eng
      value: ISO/TC 154 also request its members to participate actively in the BSR
        work
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '1996-10-21'
      type: adoption
    message:
    - spelling: eng
      value: Unanimous
  considerations:
  - type: considering
    date_effective:
      date: '1996-10-21'
      type: effective
    message:
    - spelling: eng
      value: ISO/TC 154 regards the harmonisation and registration of data as one
        of its major roles and recognises that the BSR is a key tool to achieve that
        objective.
  - type: according
    date_effective:
      date: '1996-10-21'
      type: effective
    message:
    - spelling: eng
      value: Further, in accordance with the ISO BSR/CC resolution 96/8 stating that
        the BSR Rules and Guidelines and Content shall become ISO standards with its
        own registration authority
