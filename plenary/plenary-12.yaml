  - spelling: eng
    value: ISO/TC 154
  actions:
  - type: resolves
    date_effective:
      date: '1996-10-21'
      type: effective
    message:
    - spelling: eng
      value: |
        ISO/TC 154 resolves, following on the resolution 101, that the ad hoc group shall continue the work to revise the existing scope in accordance with the agreements reached at this meeting. The proposals shall be submitted to ISO/TC 154 Secretariat by the end of March 1997

        Convenor of this group will be Tuisko Buchmann
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '1996-10-21'
      type: adoption
    message:
    - spelling: eng
      value: Unanimous
  considerations:
  - type: following
    date_effective:
      date: '1996-10-21'
      type: effective
    message:
    - spelling: eng
      value: following on the resolution 101
- identifier:
  - prefix: ISO/TC 154
    number: '119'
  kind: resolution
  status: decided
  dates:
  - date: '1996-10-21'
    type: adoption
  subject:
  - spelling: eng
    value: ISO/TC 154
  actions:
  - type: establishes
    date_effective:
      date: '1996-10-21'
      type: effective
    message:
    - spelling: eng
      value: |
        ISO/TC 154 resolves to establish a special task force for the revision of ISO 7372. Subject to confirmation the group will consist of:
        Marcel Deturche (Convenor)
        Pierre Chaussard
        Tuisko Buchmann
        Robert (Bob) Crowley
        Denis Hill
        Alain Thiénot
        Jean Kubler / Francois Vuillemier
        Hartmut Hermes / Sabine Hofmann
  - type: resolves
    date_effective:
      date: '1996-10-21'
      type: effective
    message:
    - spelling: eng
      value: |
        ISO/TC 154 resolved that
        - there is a need for a consolidated data element directory to cover BSU representation in standards published by ISO/TC 154, mainly ISO 6422 (Layout key for trade documents) and UN/TDID
        - in order to achieve consistency of data specification across all subject areas, the work of ISO/TC 154 shall be progressed in close collaboration with ISO/IEC JTC 1/SC 14 (and the use of ISO/IEC 11179) and the BSR project
        - the data element directory shall have its own maintenance procedures and rules
        - at a further stage other subject areas can be added
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '1996-10-21'
      type: adoption
    message:
    - spelling: eng
      value: Unanimous
  considerations:
  - type: recognising
    date_effective:
      date: '1996-10-21'
      type: effective
    message:
    - spelling: eng
      value: Recognising that the ISO 7372 (TDED) covers data elements in support
        of trade and that these data elements are composed of data elements concepts
        plus representation and that the BSR is predicated on the specification of
        data elements concepts alone
