- identifier:
  - prefix: ISO/TC 154
    number: '313'
  kind: resolution
  status: decided
  dates:
  - date: '2011-09-14'
    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    message: |
      ISO/TC 154 resolves to:
      - Acknowledge the deliverable of ISO/NP TS 17369 to become a full ISO standard;
      - Accept the latest draft delivered by WG2 as a Committee Draft;
      - Install an ad-hoc working group with the task to deliver a DIS 17369 to the TC 154 secretariat and invite TC 154 members to participate;
      - Install Mr Chris Nelson from the United Kingdom as Project leader
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2011-09-14'
        type: adoption
      message: Approved unanimously
    actions:
    - type: acknowledges
      date_effective:
        date: '2011-09-14'
        type: effective
      message: Acknowledge the deliverable of ISO/NP TS 17369 to become a full ISO
        standard;
    - type: accepts
      date_effective:
        date: '2011-09-14'
        type: effective
      message: Accept the latest draft delivered by WG2 as a Committee Draft;
    - type: creates
      date_effective:
        date: '2011-09-14'
        type: effective
      message: Install an ad-hoc working group with the task to deliver a DIS 17369
        to the TC 154 secretariat and invite TC 154 members to participate;
    - type: appoints
      date_effective:
        date: '2011-09-14'
        type: effective
      message: Install Mr Chris Nelson from the United Kingdom as Project leader
