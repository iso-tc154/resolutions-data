- identifier:
  - prefix: ISO/TC 154
    number: '285'
  kind: resolution
  status: decided
  dates:
  - date: '2008-11-25'
    type: adoption
  title:
  - spelling: eng
    value: Joint processing of any DMRs related to both TDED and EDED
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: resolves
    date_effective:
      date: '2008-11-25'
      type: effective
    message:
    - spelling: eng
      value: ISO/TC 154 resolves that the joint processing of any DMRs which relate
        to both the TDED and EDED should be jointly processed by UN/CEFACT ATG1 and
        the UNECE-ISO 7372 Joint MA.
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2008-11-25'
      type: adoption
    message:
    - spelling: eng
      value: UNANIMOUS
- identifier:
  - prefix: ISO/TC 154
    number: '286'
  kind: resolution
  status: decided
  dates:
  - date: '2008-11-25'
    type: adoption
  title:
  - spelling: eng
    value: Processing of DMRs by current entry points
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: resolves
    date_effective:
      date: '2008-11-25'
      type: effective
    message:
    - spelling: eng
      value: ISO/TC 154 resolves that current entry points will continue to receive
        submitted DMRs and that processes will be drawn up for determining actions
        required in each case. DMRs may be applicable to TDED and EDED or to TDED
        only. Common DMRs shall be processed by UN/CEFACT ATG1 and the MA through
        a joint team and any TDED-only DMRs received through the UN will be passed
        by the joint team to be processed only by the MA
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2008-11-25'
      type: adoption
    message:
    - spelling: eng
      value: UNANIMOUS
