- identifier:
  - prefix: ISO/TC 154
    number: '244'
  kind: resolution
  status: decided
  urn: urn:iso:tc154:resolution:plenary-21:244
  dates:
  - date: '2003-09-12'
    type: adoption
  title:
  - spelling: eng
    value: ISO11180:1993 postal addressing (see also doc. 154n448)
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  considerations:
  - type: recalling
    date_effective:
      date: '2003-09-12'
      type: effective
    message:
    - spelling: eng
      value: recalling that trade in goods and services need to identify, in an open
        environment allowing interoperability, the parties and the location of the
        commodity, most of which parties and locations having a name and address,
        processable by all parties and all modes of transport and usable across all
        syntaxes
  - type: recalling
    date_effective:
      date: '2003-09-12'
      type: effective
    message:
    - spelling: eng
      value: recalling that ISO 11180:1993 had been launched by UPU
  - type: recalling
    date_effective:
      date: '2003-09-12'
      type: effective
    message:
    - spelling: eng
      value: 'recalling core inconsistencies between two ISO/TC 154 standards: ISO
        6422 Layout Key (e.g. 5x35 car.) and ISO 11180 (e.g. 6x30 car.)

        '
  - type: noting
    date_effective:
      date: '2003-09-12'
      type: effective
    message:
    - spelling: eng
      value: noting that ISO 11180 has not been widely implemented by ISO members
  - type: noting
    date_effective:
      date: '2003-09-12'
      type: effective
    message:
    - spelling: eng
      value: noting that ISO 11180 is no longer referenced by UPU (see e.g. the new
        UPU S42 standard)
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2003-09-12'
      type: adoption
    message:
    - spelling: eng
      value: Approved
  actions:
  - type: withdraws
    date_effective:
      date: '2003-09-12'
      type: effective
    message:
    - spelling: eng
      value: resolves to withdraw ISO 11180:1993
  - type: investigates
    date_effective:
      date: '2003-09-12'
      type: effective
    message:
    - spelling: eng
      value: |
        resolves to investigate the possibility of launching an ISO New
        Work Item (NWI) on name and address (follow-up: see action 19)

        Action 19

        1. The ISO/TC 154 chair is tasked with the preparatory steps (draft
          job description and membership) for this possible ISO New Work Item
          (NWI) on name and address
        2. draft job description: [open]

        3. draft membership: this possible NWI could involve the following
          ISO/TC 154 P(active)-members, at least 5 (identified contact
          persons):

          - BE Mr. J.-L. Champion
          - CH Mr. F. Vuilleumier
          - DE Mr. M. Dill
          - GB Ms. S.L. Probert
          - JP Mr. K. Wakaizumi
          - KR Mr. Y.-G. Jung
          - US Ms. M.K. Blantz

        in co-operation with the following ISO/TC 154 L(iaison)-members:
          - UPU (standard S42),
          - CEN/TC331 (standard CEN14142)
          - ISO/TC215 as well as other interested TC’s
          - ISO/IEC JTC1/SC32 as well as other interested SC’s
          - UN/CEFACT Forum: at least TBG, possibly ATG
          - UNECE UNeDocs Project
          - OASIS Management and UBL TC + CIQ TC
          - OAGI
