    number: '248'
  kind: resolution
  status: decided
  urn: urn:iso:tc154:resolution:plenary-21:248-2
  dates:
  - date: '2003-09-12'
    type: adoption
  title:
  - spelling: eng
    value: 'Next ISO/TC 154 (22nd) meeting: * Back-to-back meeting with ISO7372MA
      * 4 identified…'
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2003-09-12'
      type: adoption
    message:
    - spelling: eng
      value: Approved
  actions:
  - type: resolves
    date_effective:
      date: '2003-09-12'
      type: effective
    message:
    - spelling: eng
      value: |
        Next ISO/TC 154 (22nd) meeting:

        * Back-to-back meeting with ISO7372MA

        * 4 identified options:
        ** Back-to-back after the UN/CEFACT Forum: 2004-03, Europe?
        ** Back-to-back with OASIS [UBL TC]: 2004-04 2004, Copenhagen?
        ** Standalone meeting: 2004-04, McLean US or Europe (Brussels or London)?
        ** Concurrently with a possible JTC1/SC32 meeting to be held in Switzerland?
  - type: instructs
    date_effective:
      date: '2003-09-12'
      type: effective
    message:
    - spelling: eng
      value: |
        ISO/TC 154 instructs the Co-Chairs of ISO7372MA and the Chair of
        ISO/TC 154 to identify the best option and to notify the members in
        time to meet the ISO/TC 154 notification deadline (4 months)
