  title:
  - spelling: eng
    value: In the overall framework of current standardisation work for the supply
      chain security,…
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  approvals:
  - type: affirmative
    degree: unanimous
    date:
