- identifier:
  - prefix: ISO/TC 154
    number: '220'
  urn: urn:iso:tc154:resolution:plenary-19:220
  kind: resolution
  status: decided
  dates:
  - date: '2002-09-06'
    type: adoption
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: requests
    date_effective:
      date: '2002-09-06'
      type: effective
    message:
    - spelling: eng
      value: 'ISO/TC 154 resolves, in line with ISO7372MA resolution 2 (see document
        154 N 420), to request its WG 1 contact other "standardisation bodies or consortia"
        in order to know if they want to bring their data and participate to the analysis
        and comparison with other directories contained in the multilingual semantic
        tool developed during the BSR project. Examples of such bodies are: CEFACT
        Forum, OASIS, SWIFT, ISO/TC 68, ISO/TC 184. The WG 1 shall report to TC 154
        at its next meeting.

        '
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2002-09-06'
      type: adoption
    message:
    - spelling: eng
      value: Unanimous
- identifier:
  - prefix: ISO/TC 154
    number: '221'
  urn: urn:iso:tc154:resolution:plenary-19:221
  kind: resolution
  status: decided
  dates:
  - date: '2002-09-06'
    type: adoption
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: agrees
    date_effective:
      date: '2002-09-06'
      type: effective
    message:
    - spelling: eng
      value: 'ISO/TC 154, taking account of changes in semantic registers development,
        agrees to the WG 1 request to change its name to: "Semantic engine", in order
        to provide a better visibility on this part of its work. The objective of
        the WG 1 remains: "to act as a central reference to assist in the universal,
        multilingual understanding of data across commerce, industry and administration"
        (TC 154 resolution 159: see doc. 154n303).

        '
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2002-09-06'
      type: adoption
    message:
    - spelling: eng
      value: Unanimous
