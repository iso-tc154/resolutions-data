    date_effective:
      date: '2002-09-06'
      type: effective
    message:
    - spelling: eng
      value: 'ISO/TC 154, taking account of changes in semantic registers development,
        agrees to the WG 1 request to change its name to: "Semantic engine", in order
        to provide a better visibility on this part of its work. The objective of
        the WG 1 remains: "to act as a central reference to assist in the universal,
        multilingual understanding of data across commerce, industry and administration"
        (TC 154 resolution 159: see doc. 154n303).

        '
