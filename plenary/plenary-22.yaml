        type: adoption
      message: Approved
    actions:
    - type: requests
      date_effective:
        date: '2004-09-10'
        type: effective
      message: Pending approval of the ballot on 15000-Part 5, ISO/TC 154 resolves
        to request the establishment of a formal liaison between the ISO/TC 154 project
        team for TS 15000-Part 5 and ISO/IEC JTC 1/SC32 (WG1 & 2). The purpose of
        this liaison is to avoid possible duplication of efforts and the publication
        of conflicting specifications
- identifier:
  - prefix: ISO/TC 154
    number: '252'
  kind: resolution
  status: decided
  dates:
  - date: '2004-09-10'
    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2004-09-10'
        type: adoption
      message: Approved
    actions:
    - type: requests
      date_effective:
        date: '2004-09-10'
        type: effective
      message: ISO/TC 154 becoming aware of the establishment of a JTC1 Web Services
        Study Group, is eager to ensure that  its suite of ebXML specifications that
        in themselves comprise a valuable form of web services is actively involve
        in the discussion. Therefore ISO/TC 154 resolves to establish an active liaison
        with the JTC1 web services study group
