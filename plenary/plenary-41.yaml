      type: effective
    message:
    - spelling: eng
      value: communicating with TC307 on behalf of TC 154
  - type: gathering
    date_effective:
      date: '2022-10-14'
      type: effective
    message:
    - spelling: eng
      value: gathering questions and answers on this topic from TC 154
  - type: drafting
    date_effective:
      date: '2022-10-14'
      type: effective
    message:
    - spelling: eng
      value: drafting a clear report on the necessity and potential proposal (title
