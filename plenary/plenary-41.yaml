    value: Adoption of an amendment of ISO 8601-2:2019/Amd.1, Appointment of Mr. Ronald
      Tse as the project leader, request ISO/CS to register the project in stage 20.00,
      and adoption of CD ballot before April 2023
  subject:
  - spelling: eng
    value: ISO/TC 154
  actions:
  - type: resolves
    date_effective:
      date: '2022-10-14'
      type: effective
    message:
    - spelling: eng
      value: resolves to amend ISO 8601-2:2019
  - type: requests
    date_effective:
      date: '2022-10-14'
      type: effective
    message:
    - spelling: eng
      value: request ISO/CS to register it as ISO 8601-2:2019 Amd.1 in stage 20.00.
  - type: resolves
    date_effective:
      date: '2022-10-14'
      type: effective
    message:
    - spelling: eng
      value: resolves to nominate Mr. Ronald Tse (Calconnect) as the project leader,
        and that the amendment period is 18 months, the target date for CD ballot
        is 2023-03-30, and the target date for DIS ballot 2023-08-30, the target date
        for FDIS submission (if required) - 2024-03-30 and the target date for the
        publication is 2024-06-30.
