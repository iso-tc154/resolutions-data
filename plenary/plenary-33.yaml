        - The material as submitted in the OASIS format is accepted by ISO/CS
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2014-10-24'
      type: adoption
    message:
    - spelling: eng
      value: The resolution was taken by unanimity
