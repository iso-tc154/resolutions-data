    value: Acceptance of ebXML parts as IS for “Fast Tracking”
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: accepts
    date_effective:
      date: '2014-10-24'
      type: effective
    message:
    - spelling: eng
      value: |
        agrees to accept the submissions of ebCPP, ebMS (Core), ebBPSS and ebRegRep for ‘Fast Tracking’ as International Standards with the following assumptions:
