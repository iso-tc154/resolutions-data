decisions:
- identifier:
  - prefix: ISO/TC 154
    number: 01-2014
  kind: resolution
  status: decided
  dates:
  - date: '2014-10-24'
    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: Request to CAT to work with ISO/CS to replace JWG1 by an ISO/MA
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    considerations:
    - type: considering
      date_effective:
        date: '2014-10-24'
        type: effective
      message: noting that after the revision of ISO 9735-10 no further revision of
        the other parts of the EDIFACT syntax (ISO 9735) are expected
    - type: considering
      date_effective:
        date: '2014-10-24'
        type: effective
      message: noting also that over the last 10 years only code DMRs were implemented
        in the Service Directory, recognizing finally that there was no active participation
        from the UNECE side
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2014-10-24'
        type: adoption
      message: The resolution was taken by unanimity
    actions:
    - type: resolves
      date_effective:
        date: '2014-10-24'
        type: effective
      message: resolves to request CAT to work with ISO/CS to replace JWG 1 by a ISO/MA
        (Maintenance Agency) by keeping the secretariat at DIN
- identifier:
  - prefix: ISO/TC 154
    number: 02-2014
  kind: resolution
  status: decided
  dates:
  - date: '2014-10-24'
    type: adoption
  localizations:
  - language_code: eng
    script: Latn
    title: Establishment of ISO/TC 154/WG6
    subject: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
    considerations:
    - type: considering
      date_effective:
        date: '2014-10-24'
        type: effective
      message: considering that two new PWIs related to “Trusted eCommunications”
    - type: considering
      date_effective:
        date: '2014-10-24'
        type: effective
      message: noting that the new project on ISO 14533-3 has a close relationship
        to this work
    approvals:
    - type: affirmative
      degree: unanimous
      date:
        date: '2014-10-24'
        type: adoption
      message: The resolution was taken by unanimity
    actions:
    - type: establishes
      date_effective:
        date: '2014-10-24'
        type: effective
      message: resolves to establish ISO/TC 154/WG 6 with the title "Trusted eCommunication",
        and WG 6 includes projects "Trusted Communication Platform for Electronic
        Documents" and project "Trusted Mobile e-Document Framework" and "ISO 14533-3".
