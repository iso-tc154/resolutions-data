- identifier:
  - prefix: ISO/TC 154
    number: 01-2014
  urn: urn:iso:tc154:resolution:plenary-33:01-2014
  kind: resolution
  status: decided
  dates:
  - date: '2014-10-24'
    type: adoption
  title:
  - spelling: eng
    value: Request to CAT to work with ISO/CS to replace JWG1 by an ISO/MA
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: resolves
    date_effective:
      date: '2014-10-24'
      type: effective
    message:
    - spelling: eng
      value: resolves to request CAT to work with ISO/CS to replace JWG 1 by a ISO/MA
        (Maintenance Agency) by keeping the secretariat at DIN
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2014-10-24'
      type: adoption
    message:
    - spelling: eng
      value: The resolution was taken by unanimity
  considerations:
  - type: considering
    date_effective:
      date: '2014-10-24'
      type: effective
    message:
    - spelling: eng
      value: noting that after the revision of ISO 9735-10 no further revision of
        the other parts of the EDIFACT syntax (ISO 9735) are expected
  - type: considering
    date_effective:
      date: '2014-10-24'
      type: effective
    message:
    - spelling: eng
      value: noting also that over the last 10 years only code DMRs were implemented
        in the Service Directory, recognizing finally that there was no active participation
        from the UNECE side
