- identifier:
  - prefix: ISO/TC 154
    number: '259'
  urn: urn:iso:tc154:resolution:plenary-23:259
  kind: resolution
  status: decided
  dates:
  - date: '2004-09-23'
    type: adoption
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: resolves
    date_effective:
      date: '2004-09-23'
      type: effective
    message:
    - spelling: eng
      value: |
        In accordance with the eBusiness MoU, ISO/TC 154 resolves to recommend to the ISO/TC 154 member countries and liaison organizations that they should:

        - submit candidate standards for business vocabularies to UN/CEFACT;
        - submit only eBusiness-related candidate implementation methodologies, specifications and guidelines based on the Core Component Technical Specification (ISO/TS 15000) for consideration as future ISO publications through ISO/TC 154;
        - implement the UN/CEFACT Core Component Technical Specification (ISO/TS 15000) and the UN/CEFACT XML naming and design rules.
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2004-09-23'
      type: adoption
    message:
    - spelling: eng
      value: Approved
- identifier:
  - prefix: ISO/TC 154
    number: '260'
  urn: urn:iso:tc154:resolution:plenary-23:260
  kind: resolution
  status: decided
  dates:
  - date: '2004-09-23'
    type: adoption
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: resolves
    date_effective:
      date: '2004-09-23'
      type: effective
    message:
    - spelling: eng
      value: |
        Several ebXML parts have been updated since being approved as ISO/TS 15000 Technical Specifications. However, no requests have been received to formally update these ISO specifications. It is critically important that all members who have maintenance responsibility of ISO/TC 154 standards fulfil their responsibilities.

        Therefore, ISO/TC 154 resolves to remind OASIS that as the Maintenance Agency for ISO/TS 15000 parts 1 through 4, they must initiate action to update these ISO/TSs consistent with updated versions published as OASIS specifications, or else ISO/TC 154 will take action to request removal of the appropriate ISO version.
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2004-09-23'
      type: adoption
    message:
    - spelling: eng
      value: Approved
