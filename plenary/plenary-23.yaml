    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  actions:
  - type: resolves
    date_effective:
      date: '2004-09-23'
      type: effective
    message:
    - spelling: eng
      value: |
        Concerning the current ballot on ISO/NP 25557 eDocs, ISO/TC 154 resolves to recommend to its voting members to take note of the position of the UN/CEFACT Forum concerning the possible outcomes of the discussion on the UNeDocs eUNLK issues.

        Independent of the outcome of the currently worded ballot, ISO/TC 154 resolves to create a Joint Working group with the UN/CEFACT Forum, providing that the Forum agrees.
  approvals:
  - type: affirmative
    degree: unanimous
    date:
      date: '2004-09-23'
      type: adoption
    message:
    - spelling: eng
      value: Approved
