    value: Initiating a meeting with UNECE on the status of the maintenance and publication
      of the UN/EDIFACT Directories
  subject:
  - spelling: eng
    value: ISO/TC 154 Processes, data elements and documents in commerce, industry
      and administration
  approvals:
  - type: affirmative
    degree: unanimous
