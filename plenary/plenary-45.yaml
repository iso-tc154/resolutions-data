      date: '2026-09-04'
      type: adoption
    message:
    - spelling: eng
      value: DIN, SAC, JISC, BSI, KATS, UNI, 6 P-members approved.
  actions:
  - type: resolves
    date_effective:
      date: '2026-09-04'
      type: effective
    message:
    - spelling: eng
      value: |
        resolves to initiate a meeting with UNECE Secretariat by the end of 2026 to request
        clarification of the status of the maintenance and publication of the UN/EDIFACT Directories especially
        D.25A which is severely delayed.
